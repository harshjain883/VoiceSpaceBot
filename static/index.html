<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Voice Space</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.9/dist/livekit-client.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; transition: background-color 0.2s ease, color 0.2s ease; }
        html.dark body { background: #0c1017; color: #f8fafc; }
        html.light body { background: #f1f5f9; color: #0f172a; }

        .glass-panel { backdrop-filter: blur(16px); }
        html.dark .glass-panel { background: rgba(20, 26, 38, 0.88); border: 1px solid rgba(255, 255, 255, 0.07); }
        html.light .glass-panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 0, 0, 0.08); }

        .glass-pill { backdrop-filter: blur(8px); }
        html.dark .glass-pill { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); }
        html.light .glass-pill { background: rgba(0, 0, 0, 0.04); border: 1px solid rgba(0, 0, 0, 0.06); }

        /* Telegram Floating Messages */
        .tg-floating-pill {
            animation: slideUpPill 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: rgba(22, 28, 38, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes slideUpPill { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TELEGRAM NATIVE AUDIO GLOW AROUND HERO MIC */
        .mic-halo-glow {
            box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.25), 0 0 25px 8px rgba(34, 197, 94, 0.45);
            animation: pulseGlow 1.4s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.2), 0 0 15px 4px rgba(34, 197, 94, 0.35); }
            100% { box-shadow: 0 0 0 14px rgba(34, 197, 94, 0.35), 0 0 32px 14px rgba(34, 197, 94, 0.6); }
        }

        .speaking-border {
            border-color: #22c55e !important;
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.4), 0 0 15px rgba(34, 197, 94, 0.4) !important;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 select-none relative overflow-hidden" onclick="resumeAudioContext()">

    <div id="remote-audio-container" class="hidden"></div>

    <!-- Top Header Bar -->
    <header class="glass-panel p-3.5 rounded-2xl flex items-center justify-between shadow-xl relative z-10">
        <div class="flex items-center gap-3 overflow-hidden">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0 animate-pulse"></span>
            <div class="flex flex-col truncate">
                <span class="text-sm font-bold truncate dark:text-white text-slate-900" id="group-title">Voice Space</span>
                <span class="text-[10px] dark:text-slate-400 text-slate-500" id="connection-state">Connecting...</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="glass-pill px-3 py-1.5 rounded-xl text-xs font-semibold dark:text-slate-300 text-slate-700 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span id="participant-count">0</span> Online
            </div>
            <button onclick="toggleTheme()" class="glass-pill p-2 rounded-xl text-amber-400">☀️</button>
        </div>
    </header>

    <!-- Center Stage: Participants Grid -->
    <main class="flex-1 flex flex-col items-center justify-start pt-6 relative z-10 overflow-hidden">
        <div id="grid" class="w-full h-full max-h-[46vh] grid grid-cols-3 gap-y-6 gap-x-4 auto-rows-max overflow-y-auto px-2 items-start justify-center"></div>
    </main>

    <!-- Live Floating Text Messages -->
    <div id="live-chat-overlay" class="absolute bottom-28 left-4 right-4 z-20 flex flex-col items-center justify-end space-y-2 pointer-events-none max-h-44 overflow-hidden"></div>

    <!-- Inline Quick Chat Input Box -->
    <div id="chat-input-bar" class="hidden absolute bottom-28 left-4 right-4 z-30 pointer-events-auto">
        <form onsubmit="handleSendChat(event)" class="glass-panel p-2 rounded-2xl flex gap-2 shadow-2xl">
            <input id="chat-input" type="text" placeholder="Type a message into voice chat..." autocomplete="off" class="flex-1 px-4 py-2.5 rounded-xl dark:bg-slate-900 bg-white border border-white/10 dark:text-white text-slate-900 text-xs outline-none">
            <button type="submit" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-semibold active:scale-95 transition">Send</button>
        </form>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="hidden glass-pill bg-rose-500/20 text-rose-400 text-xs px-4 py-2 rounded-xl text-center mb-2 relative z-10 mx-auto max-w-xs shadow-lg"></div>

    <!-- NATIVE TELEGRAM DOCK CONTROLS (Bluetooth/Speaker | Mic Glow | Message | Leave) -->
    <footer class="w-full max-w-sm mx-auto flex items-end justify-between px-4 pb-2 relative z-10">
        
        <!-- 1. Speaker / Output -->
        <div class="flex flex-col items-center gap-1">
            <button id="spk-btn" onclick="toggleAudioOutput()" class="w-13 h-13 p-3 rounded-full bg-[#38bdf8] text-white flex items-center justify-center shadow-lg active:scale-90 transition">
                <svg id="icon-speaker" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M7 9v6h4l5 5V4L11 9H7z"/>
                </svg>
                <svg id="icon-bluetooth" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
                </svg>
            </button>
            <span id="output-label" class="text-[11px] font-medium text-slate-300">Speaker</span>
        </div>

        <!-- 2. Hero Center Mic (Speaking Reactive Green Glow & Label) -->
        <div class="flex flex-col items-center gap-1.5 -mb-1">
            <button id="mic-btn" onclick="toggleMic()" class="w-18 h-18 rounded-full bg-sky-500 text-white flex items-center justify-center shadow-xl active:scale-95 transition relative">
                <svg id="mic-icon" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <span id="mic-status-label" class="text-[12px] font-semibold text-slate-200">Unmute</span>
        </div>

        <!-- 3. Message Button -->
        <div class="flex flex-col items-center gap-1">
            <button onclick="toggleChatInput()" class="w-13 h-13 p-3 rounded-full bg-[#10b981] text-white flex items-center justify-center shadow-lg active:scale-90 transition">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
            <span class="text-[11px] font-medium text-slate-300">Message</span>
        </div>

        <!-- 4. Leave Button -->
        <div class="flex flex-col items-center gap-1">
            <button onclick="leaveSpace()" class="w-13 h-13 p-3 rounded-full bg-[#ef4444] text-white flex items-center justify-center shadow-lg active:scale-90 transition">
                <svg class="w-6 h-6 rotate-135" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
            <span class="text-[11px] font-medium text-slate-300">Leave</span>
        </div>

    </footer>

    <!-- User Profile & Action Modal -->
    <div id="profile-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel p-5 rounded-3xl max-w-xs w-full text-center space-y-4 shadow-2xl">
            <div id="modal-avatar" class="w-16 h-16 rounded-full mx-auto overflow-hidden border-2 border-indigo-500"></div>
            <div>
                <h3 id="modal-name" class="font-bold text-sm"></h3>
                <span id="modal-role" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full inline-block mt-1"></span>
            </div>

            <!-- Volume Slider -->
            <div id="modal-volume-box" class="space-y-2 pt-2 border-t border-white/10 text-left">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400">Volume</span>
                    <span id="volume-val-display" class="font-bold">100%</span>
                </div>
                <input id="user-volume-slider" type="range" min="0" max="200" value="100" class="w-full h-1.5 bg-slate-700 rounded-lg">
            </div>

            <!-- Moderation Controls -->
            <div id="modal-actions" class="hidden space-y-2 pt-2 border-t border-white/10">
                <div id="owner-opt-allow-admin" class="hidden text-left flex items-center gap-2 pb-1">
                    <input type="checkbox" id="chk-allow-admin" class="rounded text-indigo-600">
                    <label for="chk-allow-admin" class="text-[11px] text-amber-300 font-medium">Allow Admins to Unmute</label>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-mod-mute" class="py-2 px-3 rounded-xl text-xs font-semibold">Lock Mic</button>
                    <button id="btn-mod-kick" class="py-2 px-3 bg-rose-500/20 text-rose-400 rounded-xl text-xs font-semibold">Remove</button>
                </div>
            </div>

            <button onclick="closeProfileModal()" class="w-full py-1 text-xs text-slate-400">Close</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

        let room = null;
        let isMuted = true;
        let isSpeakingNow = false;
        let myPhotoUrl = "";
        let localAudioTrack = null;
        let micInitialized = false;

        let currentChatId = "";
        let amIBotOwner = false;
        let amIGroupAdmin = false;
        let amIHardLocked = false;
        let participantStates = {};

        let bluetoothDeviceId = null;
        let currentSinkId = "default";
        let isSpeakerOn = true;

        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function getLiveKit() { return window.LivekitClient || window.livekit || window.LiveKit; }

        function resumeAudioContext() {
            document.querySelectorAll('audio').forEach(a => { if (a.paused && a.srcObject) a.play().catch(() => {}); });
        }

        async function detectAudioDevices() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const bt = devices.find(d => 
                    (d.kind === 'audiooutput' || d.kind === 'audioinput') &&
                    (d.label.toLowerCase().includes('bluetooth') || d.label.toLowerCase().includes('airpods') || d.label.toLowerCase().includes('buds'))
                );

                const spkIcon = document.getElementById('icon-speaker');
                const btIcon = document.getElementById('icon-bluetooth');
                const outLabel = document.getElementById('output-label');

                if (bt) {
                    bluetoothDeviceId = bt.deviceId;
                    btIcon.classList.remove('hidden');
                    spkIcon.classList.add('hidden');
                    outLabel.innerText = "Bluetooth";
                } else {
                    bluetoothDeviceId = null;
                    btIcon.classList.add('hidden');
                    spkIcon.classList.remove('hidden');
                    outLabel.innerText = "Speaker";
                }
            } catch(e) {}
        }

        async function startVoiceSession() {
            const urlParams = new URLSearchParams(window.location.search);
            currentChatId = tg?.initDataUnsafe?.start_param || urlParams.get('tgWebAppStartParam') || urlParams.get('chat_id') || "";
            if (!currentChatId) return showError("Session parameter missing.");

            const LK = getLiveKit();
            if (!LK) return showError("Audio SDK load failed.");

            try {
                const res = await fetch('/api/get-token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: currentChatId, init_data: tg?.initData || "" })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Authentication Failed");

                document.getElementById('group-title').innerText = data.group_title || "Voice Space";
                amIBotOwner = data.is_owner || false;
                amIGroupAdmin = data.is_admin || false;
                amIHardLocked = data.is_muted || false;

                room = new LK.Room({
                    audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    publishDefaults: { dtx: false, red: true }
                });

                room.on(LK.RoomEvent.Disconnected, () => {
                    alert("Voice Space session ended.");
                    if (tg && tg.close) tg.close(); else window.close();
                });

                room.on(LK.RoomEvent.TrackSubscribed, (track, pub, p) => {
                    if (track.kind === LK.Track.Kind.Audio) {
                        const audioEl = track.attach();
                        audioEl.id = `audio-${p.identity}`;
                        document.getElementById('remote-audio-container').appendChild(audioEl);
                        if (currentSinkId && audioEl.setSinkId) audioEl.setSinkId(currentSinkId).catch(() => {});
                        audioEl.play().catch(() => {});
                    }
                });

                room.on(LK.RoomEvent.TrackUnsubscribed, track => track.detach().forEach(el => el.remove()));
                room.on(LK.RoomEvent.ParticipantConnected, renderUsers);
                room.on(LK.RoomEvent.ParticipantDisconnected, renderUsers);
                room.on(LK.RoomEvent.ActiveSpeakersChanged, handleSpeakers);

                room.on(LK.RoomEvent.DataReceived, async (payload) => {
                    try {
                        const msg = JSON.parse(new TextDecoder().decode(payload));
                        const myId = String(room.localParticipant.identity);

                        if (msg.type === "MOD_STATE_CHANGE") {
                            participantStates[msg.targetId] = msg.state;
                            renderUsers();

                            if (msg.targetId === myId) {
                                if (msg.state.is_muted) {
                                    amIHardLocked = true;
                                    if (localAudioTrack) await localAudioTrack.mute();
                                    isMuted = true;
                                    isSpeakingNow = false;
                                    updateMicUI();
                                    alert(msg.state.by_owner ? "Bot Owner has locked your microphone." : "Group Admin has locked your microphone.");
                                } else {
                                    amIHardLocked = false;
                                    alert("Your microphone has been unlocked. You can unmute now.");
                                }
                            }
                        } else if (msg.type === "MOD_KICK" && msg.targetId === myId) {
                            alert("You have been removed from the space.");
                            leaveSpace();
                        } else if (msg.type === "CHAT") {
                            displayFloatingMessage(msg.name, msg.photo_url, msg.text);
                        }
                    } catch(e) {}
                });

                await room.connect(data.livekit_url, data.token);

                await initMicrophoneOnce();
                await detectAudioDevices();

                document.getElementById('connection-state').innerText = "Connected";
                document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0";
                updateMicUI();
                renderUsers();

            } catch (err) {
                showError(err.message || "Connection failed");
            }
        }

        async function initMicrophoneOnce() {
            if (micInitialized) return;
            const LK = getLiveKit();
            try {
                localAudioTrack = await LK.createLocalAudioTrack({
                    echoCancellation: true, noiseSuppression: true, autoGainControl: true
                });
                await localAudioTrack.mute();
                await room.localParticipant.publishTrack(localAudioTrack);
                micInitialized = true;
                isMuted = true;
            } catch(e) {
                console.warn("Mic initialization error:", e);
            }
        }

        async function toggleMic() {
            if (!room) return;
            if (amIHardLocked) {
                return alert("You are locked by Admin/Owner and cannot unmute yourself.");
            }

            if (!localAudioTrack) {
                await initMicrophoneOnce();
            }

            if (isMuted) {
                await localAudioTrack.unmute();
                isMuted = false;
            } else {
                await localAudioTrack.mute();
                isMuted = true;
                isSpeakingNow = false;
            }
            updateMicUI();
        }

        // TELEGRAM NATIVE DYNAMIC MIC GLOW & STATE UPDATE
        function updateMicUI() {
            const btn = document.getElementById('mic-btn');
            const icon = document.getElementById('mic-icon');
            const label = document.getElementById('mic-status-label');

            if (amIHardLocked) {
                btn.className = "w-18 h-18 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center shadow-xl active:scale-95 transition relative";
                icon.innerHTML = `<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 02-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/><line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"/>`;
                label.innerText = "Locked";
                btn.classList.remove('mic-halo-glow');
            } else if (isMuted) {
                btn.className = "w-18 h-18 rounded-full bg-[#38bdf8] text-white flex items-center justify-center shadow-xl active:scale-95 transition relative";
                icon.innerHTML = `<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.12c0-.04.02-.08.02-.12V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.94zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>`;
                label.innerText = "Unmute";
                btn.classList.remove('mic-halo-glow');
            } else {
                btn.className = "w-18 h-18 rounded-full bg-[#22c55e] text-white flex items-center justify-center shadow-xl active:scale-95 transition relative";
                icon.innerHTML = `<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>`;
                label.innerText = "You're Live";

                // Glows dynamically when speaking
                if (isSpeakingNow) {
                    btn.classList.add('mic-halo-glow');
                } else {
                    btn.classList.remove('mic-halo-glow');
                }
            }
        }

        async function toggleAudioOutput() {
            await detectAudioDevices();
            const audios = document.querySelectorAll('#remote-audio-container audio');

            if (bluetoothDeviceId) {
                currentSinkId = (currentSinkId === bluetoothDeviceId) ? "default" : bluetoothDeviceId;
                audios.forEach(a => { if (a.setSinkId) a.setSinkId(currentSinkId).catch(() => {}); });
                const btIcon = document.getElementById('icon-bluetooth');
                const outLabel = document.getElementById('output-label');
                if (currentSinkId === bluetoothDeviceId) {
                    btIcon.classList.add('text-emerald-300');
                    outLabel.innerText = "Bluetooth";
                } else {
                    btIcon.classList.remove('text-emerald-300');
                    outLabel.innerText = "Speaker";
                }
            } else {
                isSpeakerOn = !isSpeakerOn;
                audios.forEach(a => a.muted = !isSpeakerOn);
                const btn = document.getElementById('spk-btn');
                const outLabel = document.getElementById('output-label');
                if (isSpeakerOn) {
                    btn.className = "w-13 h-13 p-3 rounded-full bg-[#38bdf8] text-white flex items-center justify-center shadow-lg active:scale-90 transition";
                    outLabel.innerText = "Speaker";
                } else {
                    btn.className = "w-13 h-13 p-3 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center shadow-lg active:scale-90 transition";
                    outLabel.innerText = "Muted";
                }
            }
        }

        function renderUsers() {
            if (!room) return;
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            const participants = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
            document.getElementById('participant-count').innerText = participants.length;

            participants.forEach(p => {
                let meta = {};
                try { meta = JSON.parse(p.metadata || "{}"); } catch(e) {}
                const state = participantStates[p.identity] || { is_muted: meta.is_muted };

                const card = document.createElement('div');
                card.className = "flex flex-col items-center gap-1.5 cursor-pointer";
                card.onclick = () => openProfileModal(p, meta, state);

                const bubble = document.createElement('div');
                bubble.id = `user-${p.identity}`;
                bubble.className = `relative w-16 h-16 rounded-full border-2 ${meta.is_owner ? 'border-amber-400' : (meta.is_admin ? 'border-sky-400' : 'border-white/10')} flex items-center justify-center bg-slate-800 overflow-hidden`;

                if (meta.photo_url) {
                    bubble.innerHTML = `<img src="${meta.photo_url}" class="w-full h-full object-cover">`;
                } else {
                    bubble.innerHTML = `<span class="font-bold text-base text-white">${(p.name || "U")[0]}</span>`;
                }

                if (state.is_muted) {
                    const muteBadge = document.createElement('div');
                    muteBadge.className = "absolute bottom-0 right-0 bg-rose-600 rounded-full p-1 border border-black";
                    muteBadge.innerHTML = `<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 02-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/><line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"/></svg>`;
                    bubble.appendChild(muteBadge);
                }

                const label = document.createElement('span');
                label.className = "text-[11px] font-semibold truncate max-w-[75px]";
                label.innerText = p.name || `User ${p.identity}`;

                card.appendChild(bubble);
                card.appendChild(label);
                grid.appendChild(card);
            });
        }

        function openProfileModal(p, meta, state) {
            const isSelf = p.identity === room?.localParticipant?.identity;
            document.getElementById('modal-name').innerText = p.name || "User";
            document.getElementById('modal-avatar').innerHTML = meta.photo_url ? `<img src="${meta.photo_url}" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-slate-700 text-white flex items-center justify-center font-bold text-lg">${(p.name || "U")[0]}</div>`;

            const roleEl = document.getElementById('modal-role');
            roleEl.innerText = meta.is_owner ? "Bot Owner" : (meta.is_admin ? "Group Admin" : "Member");
            roleEl.className = `text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full inline-block mt-1 ${meta.is_owner ? 'bg-amber-400/20 text-amber-400' : (meta.is_admin ? 'bg-sky-400/20 text-sky-400' : 'bg-slate-500/20 text-slate-400')}`;

            const actionsBox = document.getElementById('modal-actions');
            const ownerOpt = document.getElementById('owner-opt-allow-admin');
            const muteBtn = document.getElementById('btn-mod-mute');

            let canModerate = false;
            let canUnmute = false;

            if (!isSelf && !meta.is_owner) {
                if (amIBotOwner) {
                    canModerate = true;
                    canUnmute = true;
                } else if (amIGroupAdmin && !meta.is_admin) {
                    canModerate = true;
                    if (state.is_muted) {
                        canUnmute = !state.by_owner || state.allow_admin;
                    } else {
                        canUnmute = true;
                    }
                }
            }

            if (canModerate) {
                actionsBox.classList.remove('hidden');
                if (amIBotOwner) ownerOpt.classList.remove('hidden'); else ownerOpt.classList.add('hidden');

                if (state.is_muted) {
                    muteBtn.innerText = "Unlock Mic";
                    muteBtn.className = "py-2 px-3 bg-emerald-500/20 text-emerald-400 rounded-xl text-xs font-semibold";
                    muteBtn.disabled = !canUnmute;
                    muteBtn.onclick = () => executeModAction(p.identity, "unmute");
                } else {
                    muteBtn.innerText = "Lock Mic";
                    muteBtn.className = "py-2 px-3 bg-amber-500/20 text-amber-400 rounded-xl text-xs font-semibold";
                    muteBtn.disabled = false;
                    muteBtn.onclick = () => executeModAction(p.identity, "mute");
                }

                document.getElementById('btn-mod-kick').onclick = () => executeModAction(p.identity, "kick");
            } else {
                actionsBox.classList.add('hidden');
            }

            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

        async function executeModAction(targetId, action) {
            const allowAdmin = document.getElementById('chk-allow-admin').checked;
            try {
                const res = await fetch('/api/moderate-user', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: currentChatId,
                        init_data: tg?.initData || "",
                        target_user_id: parseInt(targetId),
                        action: action,
                        allow_admin_unmute: allowAdmin
                    })
                });

                const data = await res.json();
                if (!res.ok) return alert(data.detail || "Action failed");

                const stateObj = {
                    is_muted: action === "mute",
                    by_owner: amIBotOwner,
                    allow_admin: allowAdmin
                };

                if (action === "kick") {
                    room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({ type: "MOD_KICK", targetId })), { reliable: true });
                } else {
                    participantStates[targetId] = stateObj;
                    room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({
                        type: "MOD_STATE_CHANGE", targetId, state: stateObj
                    })), { reliable: true });
                }

                renderUsers();
                closeProfileModal();
            } catch(e) {
                alert("Network error: " + e.message);
            }
        }

        // DYNAMIC AUDIO DETECTION: TURNS ON GLOW WHEN YOU SPEAK
        function handleSpeakers(speakers) {
            document.querySelectorAll('[id^="user-"]').forEach(el => el.classList.remove('speaking-border'));
            let amISpeaking = false;

            speakers.forEach(s => {
                const t = document.getElementById(`user-${s.identity}`);
                if (t) t.classList.add('speaking-border');

                if (room && s.identity === room.localParticipant.identity) {
                    amISpeaking = true;
                }
            });

            isSpeakingNow = amISpeaking && !isMuted;
            updateMicUI();
        }

        function toggleChatInput() {
            const b = document.getElementById('chat-input-bar');
            b.classList.toggle('hidden');
            if (!b.classList.contains('hidden')) document.getElementById('chat-input').focus();
        }

        function handleSendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !room) return;

            const payload = JSON.stringify({ type: "CHAT", name: room.localParticipant.name || "Me", photo_url: myPhotoUrl, text: msg });
            room.localParticipant.publishData(new TextEncoder().encode(payload), { reliable: true });
            displayFloatingMessage(room.localParticipant.name || "Me", myPhotoUrl, msg);
            input.value = "";
            toggleChatInput();
        }

        function displayFloatingMessage(name, photoUrl, text) {
            const overlay = document.getElementById('live-chat-overlay');
            const item = document.createElement('div');
            item.className = "tg-floating-pill px-3 py-1.5 rounded-full text-xs flex items-center gap-2 max-w-[90%] text-white";
            item.innerHTML = `<span class="font-bold text-indigo-400">${name}:</span> <span class="truncate">${text}</span>`;
            overlay.appendChild(item);
            setTimeout(() => { if (item.parentNode === overlay) overlay.removeChild(item); }, 20000);
        }

        async function leaveSpace() {
            if (localAudioTrack) { localAudioTrack.stop(); }
            if (room) await room.disconnect();
            if (tg && tg.close) tg.close(); else window.close();
        }

        function toggleTheme() {
            const root = document.getElementById('html-root');
            root.classList.toggle('dark');
            root.classList.toggle('light');
        }

        window.addEventListener('DOMContentLoaded', () => {
            let attempts = 0;
            const t = setInterval(() => {
                attempts++;
                if (getLiveKit() || attempts > 25) { clearInterval(t); startVoiceSession(); }
            }, 100);
        });
    </script>
</body>
</html>

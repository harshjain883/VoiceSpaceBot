<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Voice Space</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.9/dist/livekit-client.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; transition: background-color 0.2s ease, color 0.2s ease; }
        html.dark body { background: #0c1017; color: #f8fafc; }
        html.light body { background: #f1f5f9; color: #0f172a; }

        .glass-panel { backdrop-filter: blur(16px); }
        html.dark .glass-panel { background: rgba(20, 26, 38, 0.9); border: 1px solid rgba(255, 255, 255, 0.08); }
        html.light .glass-panel { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(0, 0, 0, 0.08); }

        .glass-pill { backdrop-filter: blur(8px); }
        html.dark .glass-pill { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); }
        html.light .glass-pill { background: rgba(0, 0, 0, 0.04); border: 1px solid rgba(0, 0, 0, 0.06); }

        /* Telegram Native Floating Chat Pill */
        .tg-chat-bubble {
            animation: slideUpPill 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: rgba(23, 30, 42, 0.92);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        @keyframes slideUpPill { 
            from { opacity: 0; transform: translateY(12px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* NATIVE 1:1 WEBP EMOJI (No Zoom-Out/In, Crisp Original Aspect) */
        .realistic-emoji-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: inline-block;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        /* VERTICAL 3D CAROUSEL SINGLE-LINE STRIP */
        .single-line-carousel {
            height: 48px;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            perspective: 600px;
        }
        .single-line-carousel::-webkit-scrollbar {
            display: none;
        }

        /* Horizontal flex row inside vertical reel */
        .carousel-row {
            height: 48px;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .dock-emoji-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }
        .dock-emoji-btn:active {
            transform: scale(0.9);
        }

        .aesthetic-dock {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html.dark .aesthetic-dock {
            background: rgba(18, 24, 37, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        html.light .aesthetic-dock {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .mic-speaking-glow {
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.25), 0 0 25px rgba(34, 197, 94, 0.55);
            animation: rippleGlow 1.3s ease-in-out infinite alternate;
        }
        @keyframes rippleGlow {
            0% { transform: scale(1); box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2), 0 0 15px rgba(34, 197, 94, 0.4); }
            100% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0.35), 0 0 30px rgba(34, 197, 94, 0.65); }
        }

        .speaking-ring {
            border-color: #22c55e !important;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.4), 0 0 20px rgba(34, 197, 94, 0.6) !important;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 select-none relative overflow-hidden" onclick="handleBodyClick(event)">

    <div id="remote-audio-container" class="hidden"></div>

    <header class="glass-panel p-3.5 rounded-2xl flex items-center justify-between shadow-xl relative z-10">
        <div class="flex items-center gap-3 overflow-hidden">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0 animate-pulse"></span>
            <div class="flex flex-col truncate">
                <span class="text-sm font-bold truncate dark:text-white text-slate-900" id="group-title">Voice Space</span>
                <span class="text-[10px] dark:text-slate-400 text-slate-500" id="connection-state">Connecting...</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="glass-pill px-3 py-1.5 rounded-xl text-xs font-semibold dark:text-slate-300 text-slate-700 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span id="participant-count">0</span> Online
            </div>
            <button onclick="toggleTheme()" class="glass-pill p-2 rounded-xl text-amber-400">☀️</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-start pt-6 relative z-10 overflow-hidden">
        <div id="grid" class="w-full h-full max-h-[46vh] grid grid-cols-3 gap-y-6 gap-x-4 auto-rows-max overflow-y-auto px-2 items-start justify-center"></div>
    </main>

    <!-- Floating Live Chat Messages -->
    <div id="live-chat-overlay" class="absolute bottom-28 left-4 right-4 z-20 flex flex-col items-center justify-end space-y-2 pointer-events-none max-h-44 overflow-hidden"></div>

    <!-- COMBINED MESSAGE & 3D SINGLE-LINE VERTICAL REEL DRAWER -->
    <div id="message-drawer" class="hidden absolute bottom-24 left-4 right-4 z-30 flex flex-col gap-2 pointer-events-auto">
        
        <!-- Single-Line Vertical Reel (Slide Down/Up to change emoji row) -->
        <div class="w-full max-w-sm mx-auto px-1">
            <div class="glass-panel rounded-full shadow-lg border border-white/10 px-3 py-1">
                <div id="emoji-picker-container" class="single-line-carousel">
                    <!-- Populated in rows of 7 by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Text Chat Input Form -->
        <form id="chat-form" onsubmit="handleSendChat(event)" class="glass-panel p-2 rounded-2xl flex gap-2 shadow-2xl max-w-sm mx-auto w-full">
            <input id="chat-input" type="text" placeholder="Type message or swipe emojis..." autocomplete="off" class="flex-1 px-4 py-2.5 rounded-xl dark:bg-slate-900 bg-white border border-white/10 dark:text-white text-slate-900 text-xs outline-none focus:border-sky-500">
            <button type="submit" onmousedown="preventInputBlur(event)" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-semibold active:scale-95 transition">Send</button>
        </form>
    </div>

    <div id="error-banner" class="hidden glass-pill bg-rose-500/20 text-rose-400 text-xs px-4 py-2 rounded-xl text-center mb-2 relative z-10 mx-auto max-w-xs shadow-lg"></div>

    <!-- Bottom Dock Controls -->
    <footer class="aesthetic-dock w-full max-w-sm mx-auto px-4 py-3 flex items-center justify-between relative z-10 mb-2">
        <div class="flex flex-col items-center gap-1.5 flex-1">
            <button id="spk-btn" onclick="cycleAudioRoute()" class="w-12 h-12 rounded-full bg-sky-500/15 dark:bg-sky-400/20 text-sky-600 dark:text-sky-400 border border-sky-500/30 flex items-center justify-center shadow-sm active:scale-90 transition">
                <svg id="icon-speaker" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg id="icon-bluetooth" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
                </svg>
                <svg id="icon-earpiece" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
            </button>
            <span id="output-label" class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">Speaker</span>
        </div>

        <div class="flex flex-col items-center gap-1.5 flex-1 -mt-4">
            <button id="mic-btn" onclick="toggleMic()" class="w-16 h-16 rounded-full bg-gradient-to-tr from-sky-500 to-sky-400 text-white flex items-center justify-center shadow-lg shadow-sky-500/30 active:scale-95 transition relative border-2 border-white/40 dark:border-white/20">
                <svg id="mic-icon" class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.12c0-.04.02-.08.02-.12V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.94zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>
                </svg>
            </button>
            <span id="mic-status-label" class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Unmute</span>
        </div>

        <div class="flex flex-col items-center gap-1.5 flex-1">
            <button id="msg-btn" onclick="toggleMessageDrawer(event)" class="w-12 h-12 rounded-full bg-emerald-500/15 dark:bg-emerald-400/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 flex items-center justify-center shadow-sm active:scale-90 transition">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
            <span id="msg-label" class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">Message</span>
        </div>

        <div class="flex flex-col items-center gap-1.5 flex-1">
            <button onclick="leaveSpace()" class="w-12 h-12 rounded-full bg-rose-500/15 dark:bg-rose-400/20 text-rose-600 dark:text-rose-400 border border-rose-500/30 flex items-center justify-center shadow-sm active:scale-90 transition">
                <svg class="w-5 h-5 rotate-135" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
            <span id="leave-label" class="text-[11px] font-semibold text-slate-700 dark:text-slate-300">Leave</span>
        </div>
    </footer>

    <div id="custom-app-dialog" class="hidden fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-5">
        <div class="glass-panel p-5 rounded-3xl max-w-xs w-full text-left space-y-3 shadow-2xl border border-white/10">
            <div class="flex items-center justify-between">
                <span class="font-bold text-sm text-slate-100 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-sky-400"></span> Gcvoicechatbot
                </span>
            </div>
            <p id="custom-dialog-msg" class="text-xs text-slate-300 leading-relaxed"></p>
            <div class="pt-2 text-right">
                <button onclick="closeAppDialog()" class="px-5 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-semibold active:scale-95 transition">OK</button>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel p-5 rounded-3xl max-w-xs w-full text-center space-y-4 shadow-2xl">
            <div id="modal-avatar" class="w-16 h-16 rounded-full mx-auto overflow-hidden border-2 border-indigo-500"></div>
            <div>
                <h3 id="modal-name" class="font-bold text-sm"></h3>
                <span id="modal-role" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full inline-block mt-1"></span>
            </div>

            <div id="modal-volume-box" class="space-y-2 pt-2 border-t border-white/10 text-left">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400">User Volume</span>
                    <span id="volume-val-display" class="font-bold text-sky-400">100%</span>
                </div>
                <input id="user-volume-slider" type="range" min="0" max="100" value="100" class="w-full h-1.5 bg-slate-700 rounded-lg accent-sky-500 cursor-pointer">
            </div>

            <div id="modal-actions" class="hidden space-y-2 pt-2 border-t border-white/10">
                <div id="owner-opt-allow-admin" class="hidden text-left flex items-center gap-2 pb-1">
                    <input type="checkbox" id="chk-allow-admin" class="rounded text-indigo-600">
                    <label for="chk-allow-admin" class="text-[11px] text-amber-300 font-medium">Allow Admins to Unmute</label>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-mod-mute" class="py-2 px-3 rounded-xl text-xs font-semibold">Lock Mic</button>
                    <button id="btn-mod-kick" class="py-2 px-3 bg-rose-500/20 text-rose-400 rounded-xl text-xs font-semibold">Remove</button>
                </div>
            </div>

            <button onclick="closeProfileModal()" class="w-full py-1 text-xs text-slate-400">Close</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

        function showAppDialog(msg) {
            if (tg && tg.showAlert) {
                tg.showAlert(msg);
            } else {
                document.getElementById('custom-dialog-msg').innerText = msg;
                document.getElementById('custom-app-dialog').classList.remove('hidden');
            }
        }

        function closeAppDialog() {
            document.getElementById('custom-app-dialog').classList.add('hidden');
        }

        let room = null;
        let isMuted = true;
        let isSpeakingNow = false;
        let myPhotoUrl = "";
        let localAudioTrack = null;

        let currentChatId = "";
        let amIBotOwner = false;
        let amIGroupAdmin = false;
        let amIHardLocked = false;
        let participantStates = {};
        let userVolumes = {};

        let currentRoute = 'speaker';
        let cachedDevices = { bluetooth: null, speaker: null, earpiece: null };

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function resumeAudioContext() {
            getAudioContext();
            document.querySelectorAll('audio').forEach(a => { if (a.paused && a.srcObject) a.play().catch(() => {}); });
        }

        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function getLiveKit() { return window.LivekitClient || window.livekit || window.LiveKit; }

        // ==============================================================
        // SINGLE-LINE 3D VERTICAL REEL SETUP (37 Emojis in rows of 7)
        // ==============================================================
        const TOTAL_EMOJIS = 37;
        const PER_ROW = 7;

        function initEmojiPicker() {
            const container = document.getElementById('emoji-picker-container');
            if (!container) return;
            container.innerHTML = "";

            let currentRow = null;

            for (let i = 1; i <= TOTAL_EMOJIS; i++) {
                if ((i - 1) % PER_ROW === 0) {
                    currentRow = document.createElement('div');
                    currentRow.className = "carousel-row";
                    container.appendChild(currentRow);
                }

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "dock-emoji-btn";
                btn.onmousedown = preventInputBlur;
                btn.onclick = () => sendRealisticEmoji(i);
                btn.innerHTML = `<img src="/static/emojis/${i}.webp" alt="${i}" class="realistic-emoji-img pointer-events-none" loading="lazy">`;
                currentRow.appendChild(btn);
            }
        }

        let isDrawerOpen = false;

        function toggleMessageDrawer(e) {
            if (e) e.stopPropagation();
            const drawer = document.getElementById('message-drawer');
            const input = document.getElementById('chat-input');
            
            isDrawerOpen = !isDrawerOpen;
            if (isDrawerOpen) {
                drawer.classList.remove('hidden');
                setTimeout(() => input.focus(), 50);
            } else {
                hideMessageDrawer();
            }
        }

        function hideMessageDrawer() {
            const drawer = document.getElementById('message-drawer');
            const input = document.getElementById('chat-input');
            drawer.classList.add('hidden');
            input.blur();
            isDrawerOpen = false;
        }

        function preventInputBlur(e) {
            e.preventDefault();
        }

        function handleBodyClick(e) {
            resumeAudioContext();
            const drawer = document.getElementById('message-drawer');
            const msgBtn = document.getElementById('msg-btn');

            if (isDrawerOpen && !drawer.contains(e.target) && !msgBtn.contains(e.target)) {
                hideMessageDrawer();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initEmojiPicker();
            const input = document.getElementById('chat-input');
            input.addEventListener('blur', () => {
                setTimeout(() => {
                    if (document.activeElement !== input) {
                        hideMessageDrawer();
                    }
                }, 200);
            });
        });

        function sendRealisticEmoji(emojiId) {
            if (!room || !room.localParticipant) return;
            const myName = room.localParticipant.name || "Me";

            const payload = JSON.stringify({
                type: "CHAT_REALISTIC_REACTION",
                name: myName,
                photo_url: myPhotoUrl,
                emojiId: emojiId
            });

            try {
                room.localParticipant.publishData(new TextEncoder().encode(payload), {
                    reliable: true
                });
            } catch (e) {
                console.warn("Reaction error:", e);
            }

            displayFloatingRealisticReaction(myName, myPhotoUrl, emojiId);
            hideMessageDrawer();
        }

        function handleSendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !room) return;

            const myName = room.localParticipant.name || "Me";
            const payload = JSON.stringify({ type: "CHAT", name: myName, photo_url: myPhotoUrl, text: msg });
            room.localParticipant.publishData(new TextEncoder().encode(payload), { reliable: true });
            displayFloatingMessage(myName, myPhotoUrl, msg);
            input.value = "";
            hideMessageDrawer();
        }

        // ORIGINAL WEBP DISPLAY (Exact aspect ratio, no zoom artifacts)
        function displayFloatingRealisticReaction(name, photoUrl, emojiId) {
            const overlay = document.getElementById('live-chat-overlay');
            const item = document.createElement('div');
            item.className = "tg-chat-bubble px-3.5 py-1.5 rounded-full text-xs flex items-center gap-2 max-w-[90%] text-white pointer-events-auto border border-white/15 shadow-2xl";
            
            let avatarHtml = '';
            if (photoUrl) {
                avatarHtml = `<img src="${photoUrl}" class="w-5 h-5 rounded-full object-cover shrink-0 border border-white/20">`;
            } else {
                avatarHtml = `<div class="w-5 h-5 rounded-full bg-slate-700 text-white flex items-center justify-center text-[10px] font-bold shrink-0 border border-white/20">${(name || "U")[0].toUpperCase()}</div>`;
            }

            item.innerHTML = `
                ${avatarHtml}
                <div class="flex items-center gap-2 overflow-hidden">
                    <span class="font-bold text-[11px] text-sky-400 shrink-0 truncate max-w-[110px]">${name}:</span>
                    <img src="/static/emojis/${emojiId}.webp" class="realistic-emoji-img">
                </div>
            `;

            overlay.appendChild(item);
            setTimeout(() => { if (item.parentNode === overlay) overlay.removeChild(item); }, 8000);
        }

        function displayFloatingMessage(name, photoUrl, text) {
            const overlay = document.getElementById('live-chat-overlay');
            const item = document.createElement('div');
            item.className = "tg-chat-bubble px-3 py-1.5 rounded-full text-xs flex items-center gap-2 max-w-[90%] text-white pointer-events-auto";
            
            let avatarHtml = '';
            if (photoUrl) {
                avatarHtml = `<img src="${photoUrl}" class="w-5 h-5 rounded-full object-cover shrink-0 border border-white/20">`;
            } else {
                avatarHtml = `<div class="w-5 h-5 rounded-full bg-slate-700 text-white flex items-center justify-center text-[10px] font-bold shrink-0 border border-white/20">${(name || "U")[0].toUpperCase()}</div>`;
            }

            item.innerHTML = `
                ${avatarHtml}
                <div class="flex items-center gap-1.5 overflow-hidden">
                    <span class="font-bold text-[11px] text-sky-400 shrink-0 truncate max-w-[110px]">${name}:</span>
                    <span class="text-slate-200 text-[11px] truncate">${text}</span>
                </div>
            `;

            overlay.appendChild(item);
            setTimeout(() => { if (item.parentNode === overlay) overlay.removeChild(item); }, 15000);
        }

        async function refreshAudioDevices() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const outputs = devices.filter(d => d.kind === 'audiooutput');

                cachedDevices = { bluetooth: null, speaker: null, earpiece: null };

                for (const d of outputs) {
                    const label = (d.label || '').toLowerCase();
                    if (/bluetooth|buds|airpod|headset|wireless|hands-free|bt|tws|headphone/i.test(label)) {
                        if (!cachedDevices.bluetooth) cachedDevices.bluetooth = d;
                    } else if (/earpiece|receiver|telephony|handset|phone/i.test(label)) {
                        if (!cachedDevices.earpiece) cachedDevices.earpiece = d;
                    } else if (/speaker|speakerphone|built-in|loudspeaker/i.test(label)) {
                        if (!cachedDevices.speaker) cachedDevices.speaker = d;
                    }
                }

                if (!cachedDevices.speaker && outputs.length > 0) {
                    cachedDevices.speaker = outputs.find(d => d.deviceId === 'default') || outputs[0];
                }

                if (cachedDevices.bluetooth) {
                    currentRoute = 'bluetooth';
                } else if (currentRoute === 'bluetooth') {
                    currentRoute = 'speaker';
                }

                updateRouteUI();
                await applyHardwareRouting();
            } catch(e) {
                console.warn("Audio refresh:", e);
            }
        }

        async function cycleAudioRoute() {
            if (cachedDevices.bluetooth) {
                if (currentRoute === 'bluetooth') currentRoute = 'speaker';
                else if (currentRoute === 'speaker') currentRoute = 'earpiece';
                else currentRoute = 'bluetooth';
            } else {
                if (currentRoute === 'speaker') currentRoute = 'earpiece';
                else currentRoute = 'speaker';
            }

            updateRouteUI();
            await applyHardwareRouting();
        }

        function updateRouteUI() {
            const spkIcon = document.getElementById('icon-speaker');
            const btIcon = document.getElementById('icon-bluetooth');
            const earIcon = document.getElementById('icon-earpiece');
            const label = document.getElementById('output-label');
            const btn = document.getElementById('spk-btn');

            spkIcon.classList.add('hidden');
            btIcon.classList.add('hidden');
            earIcon.classList.add('hidden');

            if (currentRoute === 'bluetooth') {
                btIcon.classList.remove('hidden');
                label.innerText = "Bluetooth";
                btn.className = "w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center shadow-sm active:scale-90 transition";
            } else if (currentRoute === 'earpiece') {
                earIcon.classList.remove('hidden');
                label.innerText = "Earpiece";
                btn.className = "w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center shadow-sm active:scale-90 transition";
            } else {
                spkIcon.classList.remove('hidden');
                label.innerText = "Speaker";
                btn.className = "w-12 h-12 rounded-full bg-sky-500/15 dark:bg-sky-400/20 text-sky-600 dark:text-sky-400 border border-sky-500/30 flex items-center justify-center shadow-sm active:scale-90 transition";
            }
        }

        async function applyHardwareRouting() {
            const audios = document.querySelectorAll('#remote-audio-container audio');

            if (room && room.switchActiveDevice) {
                let targetId = "default";
                if (currentRoute === 'bluetooth' && cachedDevices.bluetooth) {
                    targetId = cachedDevices.bluetooth.deviceId;
                } else if (currentRoute === 'earpiece' && cachedDevices.earpiece) {
                    targetId = cachedDevices.earpiece.deviceId;
                } else if (cachedDevices.speaker) {
                    targetId = cachedDevices.speaker.deviceId;
                }
                try {
                    await room.switchActiveDevice('audiooutput', targetId);
                } catch(e) {}
            }

            for (const a of audios) {
                if (currentRoute === 'speaker') {
                    if (a.setSinkId) {
                        try {
                            const spkId = cachedDevices.speaker ? cachedDevices.speaker.deviceId : "default";
                            await a.setSinkId(spkId);
                        } catch(e) {
                            a.setSinkId("").catch(() => {});
                        }
                    }
                } else if (currentRoute === 'bluetooth' && cachedDevices.bluetooth) {
                    if (a.setSinkId) {
                        try {
                            await a.setSinkId(cachedDevices.bluetooth.deviceId);
                        } catch(e) {}
                    }
                } else if (currentRoute === 'earpiece' && cachedDevices.earpiece) {
                    if (a.setSinkId) {
                        try {
                            await a.setSinkId(cachedDevices.earpiece.deviceId);
                        } catch(e) {}
                    }
                }
            }
        }

        if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
            navigator.mediaDevices.addEventListener('devicechange', () => {
                refreshAudioDevices();
            });
        }

        async function startVoiceSession() {
            const urlParams = new URLSearchParams(window.location.search);
            currentChatId = tg?.initDataUnsafe?.start_param || urlParams.get('tgWebAppStartParam') || urlParams.get('chat_id') || "";
            if (!currentChatId) return showError("Session parameter missing.");

            const LK = getLiveKit();
            if (!LK) return showError("Audio SDK load failed.");

            try {
                const res = await fetch('/api/get-token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: currentChatId, init_data: tg?.initData || "" })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Authentication Failed");

                document.getElementById('group-title').innerText = data.group_title || "Voice Space";
                amIBotOwner = data.is_owner || false;
                amIGroupAdmin = data.is_admin || false;
                amIHardLocked = data.is_muted || false;

                try {
                    const parsed = tg?.initDataUnsafe?.user;
                    if (parsed && parsed.photo_url) myPhotoUrl = parsed.photo_url;
                } catch(e) {}

                room = new LK.Room({
                    audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    publishDefaults: { dtx: false, red: true }
                });

                room.on(LK.RoomEvent.Disconnected, () => {
                    showAppDialog("Voice Space session ended.");
                    setTimeout(() => { if (tg && tg.close) tg.close(); else window.close(); }, 1000);
                });

                room.on(LK.RoomEvent.TrackSubscribed, (track, pub, p) => {
                    if (track.kind === LK.Track.Kind.Audio) {
                        const audioEl = track.attach();
                        audioEl.id = `audio-${p.identity}`;
                        
                        const savedVol = userVolumes[p.identity] !== undefined ? userVolumes[p.identity] : 100;
                        audioEl.volume = savedVol / 100;

                        document.getElementById('remote-audio-container').appendChild(audioEl);
                        
                        applyHardwareRouting();
                        audioEl.play().catch(() => {});
                    }
                });

                room.on(LK.RoomEvent.TrackUnsubscribed, track => track.detach().forEach(el => el.remove()));
                room.on(LK.RoomEvent.ParticipantConnected, renderUsers);
                room.on(LK.RoomEvent.ParticipantDisconnected, renderUsers);
                room.on(LK.RoomEvent.ActiveSpeakersChanged, handleSpeakers);

                room.on(LK.RoomEvent.DataReceived, async (payload) => {
                    try {
                        const msg = JSON.parse(new TextDecoder().decode(payload));
                        const myId = String(room.localParticipant.identity);

                        if (msg.type === "CHAT_REALISTIC_REACTION") {
                            displayFloatingRealisticReaction(msg.name, msg.photo_url, msg.emojiId);
                        } else if (msg.type === "MOD_STATE_CHANGE") {
                            participantStates[msg.targetId] = msg.state;
                            renderUsers();

                            if (msg.targetId === myId) {
                                if (msg.state.is_muted) {
                                    amIHardLocked = true;
                                    if (localAudioTrack) {
                                        await localAudioTrack.mute();
                                        if (localAudioTrack.mediaStreamTrack) {
                                            localAudioTrack.mediaStreamTrack.enabled = false;
                                        }
                                    }
                                    isMuted = true;
                                    isSpeakingNow = false;
                                    updateMicUI();
                                    showAppDialog("An Administrator has locked your microphone.");
                                } else {
                                    amIHardLocked = false;
                                    updateMicUI();
                                    showAppDialog("Your microphone has been unlocked. You can unmute now.");
                                }
                            }
                        } else if (msg.type === "MOD_KICK" && msg.targetId === myId) {
                            showAppDialog("You have been removed from the Voice Space.");
                            setTimeout(() => leaveSpace(), 800);
                        } else if (msg.type === "CHAT") {
                            displayFloatingMessage(msg.name, msg.photo_url, msg.text);
                        }
                    } catch(e) {}
                });

                await room.connect(data.livekit_url, data.token);
                await refreshAudioDevices();

                document.getElementById('connection-state').innerText = "Connected";
                document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0";
                updateMicUI();
                renderUsers();

            } catch (err) {
                showError(err.message || "Connection failed");
            }
        }

        async function toggleMic() {
            if (!room) return;
            if (amIHardLocked) {
                return showAppDialog("An Administrator has locked your microphone.");
            }

            const LK = getLiveKit();

            if (!localAudioTrack) {
                try {
                    localAudioTrack = await LK.createLocalAudioTrack({
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    });
                    await room.localParticipant.publishTrack(localAudioTrack);
                    isMuted = false;
                    
                    if (localAudioTrack.mediaStreamTrack) {
                        localAudioTrack.mediaStreamTrack.enabled = true;
                    }
                    updateMicUI();
                    
                    await refreshAudioDevices();
                    return;
                } catch (err) {
                    showAppDialog("Microphone permission denied. Please allow mic access.");
                    return;
                }
            }

            if (isMuted) {
                if (localAudioTrack.mediaStreamTrack) {
                    localAudioTrack.mediaStreamTrack.enabled = true;
                }
                await localAudioTrack.unmute();
                isMuted = false;
            } else {
                if (localAudioTrack.mediaStreamTrack) {
                    localAudioTrack.mediaStreamTrack.enabled = false;
                }
                await localAudioTrack.mute();
                isMuted = true;
                isSpeakingNow = false;
            }

            updateMicUI();
        }

        function updateMicUI() {
            const btn = document.getElementById('mic-btn');
            const icon = document.getElementById('mic-icon');
            const label = document.getElementById('mic-status-label');

            if (amIHardLocked) {
                btn.className = "w-16 h-16 rounded-full bg-slate-400/30 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center shadow-md active:scale-95 transition relative border-2 border-white/20";
                icon.innerHTML = `<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 02-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/><line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"/>`;
                label.innerText = "Locked";
                btn.classList.remove('mic-speaking-glow');
            } else if (isMuted) {
                btn.className = "w-16 h-16 rounded-full bg-gradient-to-tr from-sky-500 to-sky-400 text-white flex items-center justify-center shadow-lg shadow-sky-500/30 active:scale-95 transition relative border-2 border-white/40 dark:border-white/20";
                icon.innerHTML = `<path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.12c0-.04.02-.08.02-.12V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.94zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>`;
                label.innerText = "Unmute";
                btn.classList.remove('mic-speaking-glow');
             } else {
                btn.className = "w-16 h-16 rounded-full bg-gradient-to-tr from-emerald-500 to-emerald-400 text-white flex items-center justify-center shadow-lg shadow-emerald-500/35 active:scale-95 transition relative border-2 border-white/40 dark:border-white/20";
                icon.innerHTML = `<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>`;
                label.innerText = "You're Live";

                if (isSpeakingNow) {
                    btn.classList.add('mic-speaking-glow');
                } else {
                    btn.classList.remove('mic-speaking-glow');
                }
            }
        }

        function renderUsers() {
            if (!room) return;
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            const participants = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
            document.getElementById('participant-count').innerText = participants.length;

            participants.forEach(p => {
                let meta = {};
                try { meta = JSON.parse(p.metadata || "{}"); } catch(e) {}
                const state = participantStates[p.identity] || { is_muted: meta.is_muted };

                if (p === room.localParticipant && meta.photo_url) myPhotoUrl = meta.photo_url;

                const card = document.createElement('div');
                card.className = "flex flex-col items-center gap-1.5 cursor-pointer";
                card.onclick = () => openProfileModal(p, meta, state);

                const bubble = document.createElement('div');
                bubble.id = `user-${p.identity}`;
                bubble.className = `relative w-16 h-16 rounded-full border-2 ${meta.is_owner ? 'border-amber-400' : (meta.is_admin ? 'border-sky-400' : 'border-slate-300 dark:border-white/10')} flex items-center justify-center bg-slate-200 dark:bg-slate-800 overflow-visible shadow-md`;

                const imgBox = document.createElement('div');
                imgBox.className = "w-full h-full rounded-full overflow-hidden flex items-center justify-center";
                if (meta.photo_url) {
                    imgBox.innerHTML = `<img src="${meta.photo_url}" class="w-full h-full object-cover">`;
                } else {
                    imgBox.innerHTML = `<span class="font-bold text-base bg-gradient-to-tr from-pink-500 to-indigo-500 bg-clip-text text-transparent">${(p.name || "U")[0].toUpperCase()}</span>`;
                }
                bubble.appendChild(imgBox);

                if (state.is_muted) {
                    const muteBadge = document.createElement('div');
                    muteBadge.className = "absolute -bottom-1 -right-1 bg-rose-600 rounded-full p-1 border-2 border-white dark:border-[#0c1017] shadow-lg flex items-center justify-center";
                    muteBadge.innerHTML = `<svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.12c0-.04.02-.08.02-.12V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.94zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>`;
                    bubble.appendChild(muteBadge);
                }

                const label = document.createElement('span');
                label.className = "text-[11px] font-semibold truncate max-w-[75px] text-center text-slate-800 dark:text-slate-200";
                label.innerText = p.name || `User ${p.identity}`;

                card.appendChild(bubble);
                card.appendChild(label);
                grid.appendChild(card);
            });
        }

        function openProfileModal(p, meta, state) {
            const isSelf = p.identity === room?.localParticipant?.identity;
            document.getElementById('modal-name').innerText = p.name || "User";
            document.getElementById('modal-avatar').innerHTML = meta.photo_url ? `<img src="${meta.photo_url}" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-slate-300 dark:bg-slate-700 text-slate-800 dark:text-white flex items-center justify-center font-bold text-lg">${(p.name || "U")[0]}</div>`;

            const roleEl = document.getElementById('modal-role');
            roleEl.innerText = meta.is_owner ? "Bot Owner" : (meta.is_admin ? "Group Admin" : "Member");
            roleEl.className = `text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full inline-block mt-1 ${meta.is_owner ? 'bg-amber-400/20 text-amber-500 dark:text-amber-400' : (meta.is_admin ? 'bg-sky-400/20 text-sky-500 dark:text-sky-400' : 'bg-slate-500/20 text-slate-600 dark:text-slate-400')}`;

            const volumeBox = document.getElementById('modal-volume-box');
            const volumeSlider = document.getElementById('user-volume-slider');
            const volumeDisplay = document.getElementById('volume-val-display');

            if (isSelf) {
                volumeBox.classList.add('hidden');
            } else {
                volumeBox.classList.remove('hidden');
                const currentVol = userVolumes[p.identity] !== undefined ? userVolumes[p.identity] : 100;
                volumeSlider.value = currentVol;
                volumeDisplay.innerText = `${currentVol}%`;

                volumeSlider.oninput = (e) => {
                    const newVol = parseInt(e.target.value, 10);
                    volumeDisplay.innerText = `${newVol}%`;
                    userVolumes[p.identity] = newVol;

                    const audioEl = document.getElementById(`audio-${p.identity}`);
                    if (audioEl) {
                        audioEl.volume = Math.max(0, Math.min(1, newVol / 100));
                    }
                };
            }

            const actionsBox = document.getElementById('modal-actions');
            const ownerOpt = document.getElementById('owner-opt-allow-admin');
            const muteBtn = document.getElementById('btn-mod-mute');

            let canModerate = false;
            let canUnmute = false;

            if (!isSelf && !meta.is_owner) {
                if (amIBotOwner) {
                    canModerate = true;
                    canUnmute = true;
                } else if (amIGroupAdmin && !meta.is_admin) {
                    canModerate = true;
                    if (state.is_muted) {
                        canUnmute = !state.by_owner || state.allow_admin;
                    } else {
                        canUnmute = true;
                    }
                }
            }

            if (canModerate) {
                actionsBox.classList.remove('hidden');
                if (amIBotOwner) ownerOpt.classList.remove('hidden'); else ownerOpt.classList.add('hidden');

                if (state.is_muted) {
                    muteBtn.innerText = "Unlock Mic";
                    muteBtn.className = "py-2 px-3 bg-emerald-500/20 text-emerald-500 dark:text-emerald-400 rounded-xl text-xs font-semibold";
                    muteBtn.disabled = !canUnmute;
                    muteBtn.onclick = () => executeModAction(p.identity, "unmute");
                } else {
                    muteBtn.innerText = "Lock Mic";
                    muteBtn.className = "py-2 px-3 bg-amber-500/20 text-amber-500 dark:text-amber-400 rounded-xl text-xs font-semibold";
                    muteBtn.disabled = false;
                    muteBtn.onclick = () => executeModAction(p.identity, "mute");
                }

                document.getElementById('btn-mod-kick').onclick = () => executeModAction(p.identity, "kick");
            } else {
                actionsBox.classList.add('hidden');
            }

            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

        async function executeModAction(targetId, action) {
            const allowAdmin = document.getElementById('chk-allow-admin').checked;
            try {
                const res = await fetch('/api/moderate-user', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: currentChatId,
                        init_data: tg?.initData || "",
                        target_user_id: parseInt(targetId),
                        action: action,
                        allow_admin_unmute: allowAdmin
                    })
                });

                const data = await res.json();
                if (!res.ok) return showAppDialog(data.detail || "Action failed");

                const stateObj = {
                    is_muted: action === "mute",
                    by_owner: amIBotOwner,
                    allow_admin: allowAdmin
                };

                if (action === "kick") {
                    room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({ type: "MOD_KICK", targetId })), { reliable: true });
                } else {
                    participantStates[targetId] = stateObj;
                    room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({
                        type: "MOD_STATE_CHANGE", targetId, state: stateObj
                    })), { reliable: true });
                }

                renderUsers();
                closeProfileModal();
            } catch(e) {
                showAppDialog("Network error executing action");
            }
        }

        function handleSpeakers(speakers) {
            document.querySelectorAll('[id^="user-"]').forEach(el => {
                el.classList.remove('speaking-ring');
            });

            let amISpeaking = false;

            speakers.forEach(s => {
                const bubble = document.getElementById(`user-${s.identity}`);
                if (bubble) {
                    bubble.classList.add('speaking-ring');
                }

                if (room && String(s.identity) === String(room.localParticipant.identity)) {
                    amISpeaking = true;
                }
            });

            isSpeakingNow = amISpeaking && !isMuted;
            updateMicUI();
        }

        async function leaveSpace() {
            if (localAudioTrack) {
                try {
                    if (localAudioTrack.mediaStreamTrack) {
                        localAudioTrack.mediaStreamTrack.enabled = false;
                    }
                    await localAudioTrack.mute();
                } catch(e) {}
            }
            if (room) {
                await room.disconnect();
            }
            if (tg && tg.close) {
                tg.close();
            } else {
                window.close();
            }
        }

        function toggleTheme() {
            const root = document.getElementById('html-root');
            root.classList.toggle('dark');
            root.classList.toggle('light');
        }

        window.addEventListener('DOMContentLoaded', () => {
            let attempts = 0;
            const t = setInterval(() => {
                attempts++;
                if (getLiveKit() || attempts > 25) { clearInterval(t); startVoiceSession(); }
            }, 100);
        });
    </script>

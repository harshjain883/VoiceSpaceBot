<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Voice Space</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.9/dist/livekit-client.umd.min.js"></script>
    <style>
        body {
            background: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .speaking {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.4), 0 0 20px rgba(56, 189, 248, 0.6) !important;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-pill {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 select-none relative overflow-hidden">

    <!-- Top Status Bar -->
    <header class="glass-panel p-3.5 rounded-2xl flex items-center justify-between shadow-xl relative z-10">
        <div class="flex items-center gap-3 overflow-hidden">
            <span id="status-dot" class="w-3 h-3 rounded-full bg-amber-400 shrink-0 animate-pulse"></span>
            <div class="flex flex-col truncate">
                <span class="text-sm font-bold text-white truncate" id="group-title">Connecting...</span>
                <span class="text-[10px] text-slate-400" id="connection-state">Connecting space...</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <div class="glass-pill px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-200">
                <span id="participant-count">0</span> Online
            </div>
            <button onclick="toggleChat()" class="glass-pill p-2 rounded-xl text-slate-200 hover:text-white transition active:scale-95 relative">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                <span id="chat-badge" class="hidden absolute -top-1 -right-1 w-2 h-2 bg-pink-500 rounded-full"></span>
            </button>
        </div>
    </header>

    <!-- Participant Grid -->
    <main class="flex-1 flex flex-col items-center justify-center py-4 relative z-10 overflow-hidden">
        <div id="grid" class="w-full h-full max-h-[65vh] grid grid-cols-3 gap-4 auto-rows-max overflow-y-auto p-2 items-center justify-center"></div>
    </main>

    <!-- Error Banner -->
    <div id="error-banner" class="hidden glass-pill bg-rose-500/20 border-rose-500/40 text-rose-300 text-xs px-4 py-2 rounded-xl text-center mb-2 relative z-10 mx-auto max-w-xs"></div>

    <!-- Bottom Controls -->
    <footer class="glass-panel px-6 py-3 rounded-full max-w-xs mx-auto w-full flex items-center justify-between shadow-2xl relative z-10 mb-2">
        <!-- Leave -->
        <button onclick="leaveSpace()" class="w-11 h-11 rounded-full bg-rose-500/20 border border-rose-500/30 text-rose-400 flex items-center justify-center active:scale-90 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"/></svg>
        </button>

        <!-- Mic Toggle -->
        <button id="mic-btn" onclick="toggleMic()" class="w-14 h-14 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-lg active:scale-95 transition">
            <svg id="mic-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 02-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
        </button>

        <!-- Speaker Toggle -->
        <button id="spk-btn" onclick="toggleSpeaker()" class="w-11 h-11 rounded-full bg-slate-700/50 border border-white/10 text-slate-200 flex items-center justify-center active:scale-90 transition">
            <svg id="spk-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        </button>
    </footer>

    <!-- Chat Drawer -->
    <div id="chat-drawer" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex flex-col p-4 transition-all">
        <div class="flex items-center justify-between pb-3 border-b border-white/10">
            <h3 class="font-bold text-sm text-slate-100" id="chat-group-name">In-Room Chat</h3>
            <button onclick="toggleChat()" class="p-1 text-slate-400 hover:text-white rounded bg-white/5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div id="chat-box" class="flex-1 overflow-y-auto py-3 space-y-2 text-xs"></div>
        <form onsubmit="handleSendChat(event)" class="flex gap-2 pt-2 border-t border-white/10">
            <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" class="flex-1 px-3 py-2 rounded-xl bg-slate-800 border border-white/10 text-white text-xs outline-none">
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">Send</button>
        </form>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let room = null;
        let isMuted = false;
        let isSpeakerOn = true;
        let isChatOpen = false;

        const urlParams = new URLSearchParams(window.location.search);
        let rawId = tg?.initDataUnsafe?.start_param || urlParams.get('tgWebAppStartParam') || urlParams.get('chat_id') || "";

        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.innerText = msg;
            el.classList.remove('hidden');
            document.getElementById('connection-state').innerText = "Failed";
            document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-rose-500 shrink-0";
        }

        function getLiveKit() {
            return window.LivekitClient || window.livekit || window.LiveKit;
        }

        async function startVoiceSession() {
            if (!rawId) {
                return showError("Session ID missing. Please join using the link in group.");
            }

            const LK = getLiveKit();
            if (!LK) return showError("Audio library load failed. Please reopen.");

            try {
                document.getElementById('connection-state').innerText = "Authenticating...";
                
                const res = await fetch('/api/get-token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: rawId,
                        init_data: tg?.initData || ""
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Authentication Failed");
                }

                const data = await res.json();
                document.getElementById('group-title').innerText = data.group_title || "Voice Space";
                document.getElementById('chat-group-name').innerText = data.group_title || "In-Room Chat";
                document.getElementById('connection-state').innerText = "Joining SFU...";

                room = new LK.Room({
                    adaptiveStream: true,
                    dynacast: true
                });

                room.on(LK.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === LK.Track.Kind.Audio) {
                        const audio = track.attach();
                        audio.autoplay = true;
                        document.body.appendChild(audio);
                    }
                });

                room.on(LK.RoomEvent.ParticipantConnected, renderUsers);
                room.on(LK.RoomEvent.ParticipantDisconnected, renderUsers);
                room.on(LK.RoomEvent.ActiveSpeakersChanged, handleSpeakers);
                
                room.on(LK.RoomEvent.DataReceived, (payload) => {
                    try {
                        const msgObj = JSON.parse(new TextDecoder().decode(payload));
                        appendChatMessage(msgObj.name, msgObj.text, false);
                    } catch(e) {}
                });

                // Connect to LiveKit Room
                await room.connect(data.livekit_url, data.token);

                // Publish Mic (non-blocking fallback)
                try {
                    await room.localParticipant.setMicrophoneEnabled(true);
                    isMuted = false;
                } catch(e) {
                    console.warn("Mic permission deferred:", e);
                    isMuted = true;
                }
                updateMicUI();

                document.getElementById('connection-state').innerText = "Connected";
                document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-emerald-400 shrink-0";

                renderUsers();
            } catch (err) {
                console.error(err);
                showError(err.message);
            }
        }

        function renderUsers() {
            if (!room) return;
            const grid = document.getElementById('grid');
            grid.innerHTML = "";

            const participants = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
            document.getElementById('participant-count').innerText = participants.length;

            participants.forEach(p => {
                let meta = {};
                try { meta = JSON.parse(p.metadata || "{}"); } catch(e) {}

                const card = document.createElement('div');
                card.className = "flex flex-col items-center gap-1.5";

                const bubble = document.createElement('div');
                bubble.id = `user-${p.identity}`;
                bubble.className = `relative w-16 h-16 rounded-full border-2 ${meta.is_owner ? 'border-amber-400' : 'border-white/10'} flex items-center justify-center bg-slate-800 overflow-hidden`;

                if (meta.photo_url) {
                    bubble.innerHTML = `<img src="${meta.photo_url}" class="w-full h-full object-cover">`;
                } else {
                    const initials = (p.name || "U").slice(0, 1).toUpperCase();
                    bubble.innerHTML = `<span class="font-bold text-base text-indigo-400">${initials}</span>`;
                }

                if (meta.is_owner) {
                    const badge = document.createElement('span');
                    badge.className = "absolute top-0 right-0 text-[10px] bg-amber-400 text-slate-900 rounded-full px-1";
                    badge.innerText = "★";
                    bubble.appendChild(badge);
                }

                const label = document.createElement('span');
                label.className = "text-[11px] text-slate-300 font-medium truncate max-w-[75px] text-center";
                label.innerText = p.name || `User ${p.identity}`;

                card.appendChild(bubble);
                card.appendChild(label);
                grid.appendChild(card);
            });
        }

        function handleSpeakers(speakers) {
            document.querySelectorAll('[id^="user-"]').forEach(el => el.classList.remove('speaking'));
            speakers.forEach(s => {
                const target = document.getElementById(`user-${s.identity}`);
                if (target) target.classList.add('speaking');
            });
        }

        async function toggleMic() {
            if (!room) return;
            isMuted = !isMuted;
            await room.localParticipant.setMicrophoneEnabled(!isMuted);
            updateMicUI();
        }

        function updateMicUI() {
            const btn = document.getElementById('mic-btn');
            btn.className = isMuted 
                ? "w-14 h-14 rounded-full bg-rose-600 text-white flex items-center justify-center shadow-lg active:scale-95 transition"
                : "w-14 h-14 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-lg active:scale-95 transition";
        }

        function toggleSpeaker() {
            if (!room) return;
            isSpeakerOn = !isSpeakerOn;
            room.remoteParticipants.forEach(p => {
                p.audioTrackPublications.forEach(pub => {
                    if (pub.track) pub.track.setVolume(isSpeakerOn ? 1 : 0);
                });
            });
            const btn = document.getElementById('spk-btn');
            btn.className = isSpeakerOn 
                ? "w-11 h-11 rounded-full bg-slate-700/50 border border-white/10 text-slate-200 flex items-center justify-center active:scale-90 transition" 
                : "w-11 h-11 rounded-full bg-slate-800 text-slate-500 flex items-center justify-center active:scale-90 transition";
        }

        function toggleChat() {
            isChatOpen = !isChatOpen;
            const drawer = document.getElementById('chat-drawer');
            const badge = document.getElementById('chat-badge');
            if (isChatOpen) {
                drawer.classList.remove('hidden');
                badge.classList.add('hidden');
                document.getElementById('chat-input').focus();
            } else {
                drawer.classList.add('hidden');
            }
        }

        function handleSendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !room) return;

            const myName = room.localParticipant.name || "Me";
            const payload = JSON.stringify({ name: myName, text: msg });
            room.localParticipant.publishData(new TextEncoder().encode(payload), { reliable: true });

            appendChatMessage(myName, msg, true);
            input.value = "";
        }

        function appendChatMessage(name, text, isMe) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `p-2.5 rounded-xl max-w-[85%] ${isMe ? 'ml-auto bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200'}`;
            div.innerHTML = `<span class="block text-[10px] opacity-70 mb-0.5">${name}</span><p class="break-words">${text}</p>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            if (!isChatOpen && !isMe) document.getElementById('chat-badge').classList.remove('hidden');
        }

        async function leaveSpace() {
            if (room) await room.disconnect();
            if (tg && tg.close) tg.close();
            else window.close();
        }

        window.addEventListener('DOMContentLoaded', () => {
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (getLiveKit() || attempts > 30) {
                    clearInterval(timer);
                    startVoiceSession();
                }
            }, 100);
        });
    </script>
</body>
</html>

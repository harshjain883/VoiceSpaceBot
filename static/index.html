<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Voice Space</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Official Stable LiveKit Client UMD CDN Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.9/dist/livekit-client.umd.min.js"></script>
    <style>
        body { background: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .speaking { box-shadow: 0 0 0 3px #10b981, 0 0 20px rgba(16, 185, 129, 0.7); }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 select-none">

    <!-- Top Info Bar -->
    <div class="flex items-center justify-between bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
        <div class="flex items-center gap-3 overflow-hidden">
            <span id="status-dot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse shrink-0"></span>
            <div class="flex flex-col truncate">
                <span class="text-sm font-bold text-white truncate" id="group-title">Connecting...</span>
                <span class="text-[11px] text-slate-400" id="connection-state">Starting Engine</span>
            </div>
        </div>
        <span id="participant-count" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-semibold">0 Online</span>
    </div>

    <!-- Participants Grid -->
    <div id="grid" class="flex-1 grid grid-cols-3 sm:grid-cols-4 gap-4 py-6 auto-rows-max overflow-y-auto items-center justify-center"></div>

    <!-- Error/Notice Banner -->
    <div id="error-banner" class="hidden p-3 bg-rose-500/20 border border-rose-500/40 rounded-xl text-rose-300 text-xs text-center mb-2"></div>

    <!-- Bottom Controls -->
    <div class="bg-slate-800/90 backdrop-blur-md p-4 rounded-3xl border border-slate-700 flex items-center justify-around max-w-sm mx-auto w-full mb-2 shadow-2xl">
        <button onclick="leaveSpace()" class="p-4 bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 rounded-2xl active:scale-95 transition">
            <i data-lucide="phone-off" class="w-6 h-6"></i>
        </button>
        <button id="mic-btn" onclick="toggleMic()" class="p-5 bg-indigo-600 text-white rounded-full active:scale-95 transition shadow-lg shadow-indigo-500/40">
            <i id="mic-icon" data-lucide="mic" class="w-7 h-7"></i>
        </button>
        <button id="spk-btn" onclick="toggleSpeaker()" class="p-4 bg-slate-700 text-slate-200 rounded-2xl active:scale-95 transition">
            <i id="spk-icon" data-lucide="volume-2" class="w-6 h-6"></i>
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        if (window.lucide) lucide.createIcons();

        let room = null;
        let isMuted = false;
        let isSpeakerOn = true;

        // Extract Chat ID across all parameters
        const urlParams = new URLSearchParams(window.location.search);
        let rawId = tg?.initDataUnsafe?.start_param || urlParams.get('tgWebAppStartParam') || urlParams.get('chat_id') || "";
        let finalChatId = rawId ? (rawId.startsWith("-") ? rawId : (rawId.startsWith("100") ? `-${rawId}` : `-100${rawId}`)) : "";

        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.innerText = msg;
            el.classList.remove('hidden');
            document.getElementById('connection-state').innerText = "Error";
            document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-rose-500 shrink-0";
        }

        function getLiveKit() {
            return window.LivekitClient || window.livekit || window.LiveKit;
        }

        async function startVoiceSession() {
            if (!finalChatId) {
                return showError("Chat ID missing. Please launch via group /vc command.");
            }

            // Verify LiveKit Bundle loaded
            const LK = getLiveKit();
            if (!LK) {
                return showError("LiveKit SDK loading failed. Please refresh or check connection.");
            }

            try {
                document.getElementById('connection-state').innerText = "Authenticating...";
                
                const res = await fetch('/api/get-token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: finalChatId,
                        init_data: tg?.initData || ""
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Authentication Failed");
                }

                const data = await res.json();
                document.getElementById('group-title').innerText = data.group_title || "Voice Space";
                document.getElementById('connection-state').innerText = "Connecting Audio...";

                // Create LiveKit Room
                room = new LK.Room({
                    adaptiveStream: true,
                    dynacast: true,
                    audioCaptureDefaults: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // Attach Remote Audio
                room.on(LK.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === LK.Track.Kind.Audio) {
                        const audio = track.attach();
                        document.body.appendChild(audio);
                    }
                });

                room.on(LK.RoomEvent.ParticipantConnected, renderUsers);
                room.on(LK.RoomEvent.ParticipantDisconnected, renderUsers);
                room.on(LK.RoomEvent.ActiveSpeakersChanged, handleSpeakers);

                await room.connect(data.livekit_url, data.token);

                // Enable Mic
                await room.localParticipant.setMicrophoneEnabled(true);

                document.getElementById('connection-state').innerText = "Connected HD";
                document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse shrink-0";

                renderUsers();
            } catch (err) {
                console.error(err);
                showError(err.message);
            }
        }

        function renderUsers() {
            if (!room) return;
            const grid = document.getElementById('grid');
            grid.innerHTML = "";

            const participants = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
            document.getElementById('participant-count').innerText = `${participants.length} Online`;

            participants.forEach(p => {
                let meta = {};
                try { meta = JSON.parse(p.metadata || "{}"); } catch(e) {}

                const card = document.createElement('div');
                card.className = "flex flex-col items-center gap-1.5";

                const ring = document.createElement('div');
                ring.id = `user-${p.identity}`;
                ring.className = `relative w-16 h-16 rounded-full border-2 ${meta.is_owner ? 'border-amber-400 shadow-md shadow-amber-500/20' : 'border-slate-700'} flex items-center justify-center bg-slate-800 overflow-hidden`;

                if (meta.photo_url) {
                    ring.innerHTML = `<img src="${meta.photo_url}" class="w-full h-full object-cover">`;
                } else {
                    ring.innerHTML = `<span class="font-bold text-base text-indigo-400">${(p.name || "U")[0].toUpperCase()}</span>`;
                }

                if (meta.is_owner) {
                    const crown = document.createElement('span');
                    crown.className = "absolute top-0 right-0 text-[11px] bg-amber-500 text-black px-1 rounded-full";
                    crown.innerText = "👑";
                    ring.appendChild(crown);
                }

                const label = document.createElement('span');
                label.className = "text-xs text-slate-300 font-medium truncate max-w-[80px]";
                label.innerText = p.name || `User ${p.identity}`;

                card.appendChild(ring);
                card.appendChild(label);
                grid.appendChild(card);
            });
            if (window.lucide) lucide.createIcons();
        }

        function handleSpeakers(speakers) {
            document.querySelectorAll('[id^="user-"]').forEach(el => el.classList.remove('speaking'));
            speakers.forEach(s => {
                const target = document.getElementById(`user-${s.identity}`);
                if (target) target.classList.add('speaking');
            });
        }

        async function toggleMic() {
            if (!room) return;
            isMuted = !isMuted;
            await room.localParticipant.setMicrophoneEnabled(!isMuted);

            const btn = document.getElementById('mic-btn');
            btn.className = !isMuted 
                ? "p-5 bg-indigo-600 text-white rounded-full active:scale-95 transition shadow-lg shadow-indigo-500/40" 
                : "p-5 bg-rose-600 text-white rounded-full active:scale-95 transition shadow-lg shadow-rose-500/40";
            document.getElementById('mic-icon').setAttribute("data-lucide", !isMuted ? "mic" : "mic-off");
            if (window.lucide) lucide.createIcons();
        }

        function toggleSpeaker() {
            if (!room) return;
            isSpeakerOn = !isSpeakerOn;
            room.remoteParticipants.forEach(p => {
                p.audioTrackPublications.forEach(pub => {
                    if (pub.track) pub.track.setVolume(isSpeakerOn ? 1 : 0);
                });
            });
            const btn = document.getElementById('spk-btn');
            btn.className = isSpeakerOn ? "p-4 bg-slate-700 text-slate-200 rounded-2xl active:scale-95 transition" : "p-4 bg-slate-800 text-slate-500 rounded-2xl active:scale-95 transition";
            document.getElementById('spk-icon').setAttribute("data-lucide", isSpeakerOn ? "volume-2" : "volume-x");
            if (window.lucide) lucide.createIcons();
        }

        async function leaveSpace() {
            if (room) {
                await room.disconnect();
            }
            if (tg && tg.close) {
                tg.close();
            } else {
                window.close();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Small interval ensure karta hai script mobile browser me ready ho
            let attempts = 0;
            const checkLiveKitReady = setInterval(() => {
                attempts++;
                if (getLiveKit() || attempts > 20) {
                    clearInterval(checkLiveKitReady);
                    startVoiceSession();
                }
            }, 100);
        });
    </script>
</body>
</html>

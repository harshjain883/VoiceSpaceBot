<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Voice Space ✨</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.9/dist/livekit-client.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        body {
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 45%, #090d16 100%);
            color: #f8fafc;
        }
        .speaking {
            animation: cute-pulse 1.4s infinite ease-in-out;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35), 0 0 25px rgba(129, 140, 248, 0.5) !important;
        }
        @keyframes cute-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-pill {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 select-none relative overflow-hidden">

    <!-- Ambient Cute Glow Blobs -->
    <div class="absolute -top-24 -left-20 w-64 h-64 bg-violet-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 -right-24 w-72 h-72 bg-pink-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 left-1/3 w-60 h-60 bg-sky-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Floating Header -->
    <header class="glass-panel p-3.5 rounded-3xl flex items-center justify-between shadow-xl relative z-10">
        <div class="flex items-center gap-3 overflow-hidden">
            <div class="relative flex items-center justify-center w-8 h-8 rounded-2xl bg-gradient-to-tr from-pink-500 to-indigo-500 text-white text-xs shadow-md shadow-pink-500/20 shrink-0">
                <span>🎙️</span>
                <span id="status-dot" class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-amber-400 border-2 border-[#0f172a]"></span>
            </div>
            <div class="flex flex-col truncate">
                <span class="text-sm font-extrabold text-white truncate tracking-tight" id="group-title">
                    Voice Space ✨
                </span>
                <span class="text-[10px] font-medium text-indigo-300/80" id="connection-state">Connecting cozy space...</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <div class="glass-pill px-3 py-1.5 rounded-2xl flex items-center gap-1.5 text-xs font-semibold text-slate-200">
                <span class="text-[11px]">👥</span>
                <span id="participant-count">0</span>
            </div>
            <!-- Chat Trigger Button -->
            <button onclick="toggleChat()" class="glass-pill p-2 rounded-2xl text-slate-200 hover:text-pink-300 transition-all active:scale-95 relative">
                <i data-lucide="message-square" class="w-4 h-4 text-pink-400"></i>
                <span id="chat-badge" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 bg-pink-500 rounded-full ring-2 ring-indigo-900 animate-bounce"></span>
            </button>
        </div>
    </header>

    <!-- Center Stage: Grid Member Bubbles -->
    <main class="flex-1 flex flex-col items-center justify-center py-4 relative z-10 overflow-hidden">
        <div id="grid" class="w-full h-full max-h-[65vh] grid grid-cols-3 gap-y-6 gap-x-4 auto-rows-max overflow-y-auto px-2 py-4 items-center justify-center"></div>
    </main>

    <!-- Error/Notice Toast -->
    <div id="error-banner" class="hidden glass-pill bg-rose-500/10 border-rose-500/30 text-rose-300 text-xs px-4 py-2.5 rounded-2xl text-center mb-3 relative z-10 mx-auto max-w-xs shadow-lg"></div>

    <!-- Bottom Floating Island Controls -->
    <footer class="glass-panel px-6 py-3.5 rounded-full max-w-xs mx-auto w-full flex items-center justify-between shadow-2xl relative z-10 mb-2 border border-white/10">
        <!-- Leave Button -->
        <button onclick="leaveSpace()" class="w-11 h-11 rounded-full bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/25 text-rose-400 flex items-center justify-center transition active:scale-90">
            <i data-lucide="phone-off" class="w-4 h-4"></i>
        </button>

        <!-- Center Mute / Unmute Button -->
        <button id="mic-btn" onclick="toggleMic()" class="w-16 h-16 rounded-full bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 text-white flex items-center justify-center shadow-lg shadow-purple-500/40 transition active:scale-95 border-2 border-white/20">
            <i id="mic-icon" data-lucide="mic" class="w-6 h-6"></i>
        </button>

        <!-- Speaker Button -->
        <button id="spk-btn" onclick="toggleSpeaker()" class="w-11 h-11 rounded-full bg-slate-700/40 hover:bg-slate-700/60 border border-white/10 text-slate-200 flex items-center justify-center transition active:scale-90">
            <i id="spk-icon" data-lucide="volume-2" class="w-4 h-4"></i>
        </button>
    </footer>

    <!-- Profile & Admin Moderation Modal -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-xs rounded-3xl p-6 text-center space-y-4 shadow-2xl">
            <img id="modal-img" class="w-20 h-20 rounded-full mx-auto border-2 border-pink-500 object-cover bg-slate-700" src="" alt="">
            <div>
                <h3 id="modal-name" class="font-bold text-lg text-white"></h3>
                <p id="modal-role" class="text-xs font-bold uppercase mt-0.5"></p>
                <p id="modal-username" class="text-xs text-slate-400 mt-1"></p>
            </div>

            <div id="admin-actions-box" class="hidden space-y-2 pt-2 border-t border-slate-700/60">
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-mod-mute" class="p-2.5 bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 rounded-xl text-xs font-semibold">Mute User</button>
                    <button id="btn-mod-kick" class="p-2.5 bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 rounded-xl text-xs font-semibold">Kick User</button>
                </div>
            </div>

            <button id="modal-open-tg" class="w-full p-3 bg-gradient-to-r from-pink-500 to-indigo-600 rounded-xl font-semibold text-white text-sm transition">Telegram Profile</button>
            <button onclick="closeProfileModal()" class="w-full p-1 text-slate-400 text-xs">Close</button>
        </div>
    </div>

    <!-- Aesthetic Chat Drawer with Group Name in Header -->
    <div id="chat-drawer" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex flex-col p-5 transition-all">
        <!-- Chat Header Showing Exact Group Name -->
        <div class="flex items-center justify-between pb-3 border-b border-white/10">
            <div class="flex items-center gap-2 overflow-hidden">
                <span class="text-lg">💬</span>
                <div class="flex flex-col truncate">
                    <h3 class="font-bold text-sm text-slate-100 truncate" id="chat-group-name">Group Chat</h3>
                    <span class="text-[10px] text-pink-400 font-medium">In-Room Realtime Messages</span>
                </div>
            </div>
            <button onclick="toggleChat()" class="p-1.5 text-slate-400 hover:text-white rounded-xl bg-white/5 active:scale-90 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div id="chat-box" class="flex-1 overflow-y-auto py-4 space-y-3 text-xs">
            <div class="text-center text-slate-400 text-[11px] my-2 bg-white/5 py-1.5 px-3 rounded-full w-max mx-auto border border-white/5">
                🌸 Welcome to voice notes & vibes!
            </div>
        </div>

        <form onsubmit="handleSendChat(event)" class="flex gap-2 pt-2">
            <input id="chat-input" type="text" placeholder="Say something sweet..." autocomplete="off" class="flex-1 px-4 py-3 rounded-2xl bg-white/5 border border-white/10 text-white text-xs placeholder-slate-400 outline-none focus:border-pink-400/50 transition">
            <button type="submit" class="px-4 py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-indigo-600 text-white text-xs font-semibold shadow-md shadow-pink-500/25 active:scale-95 transition flex items-center justify-center">
                <i data-lucide="send" class="w-4 h-4"></i>
            </button>
        </form>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
        }
        if (window.lucide) lucide.createIcons();

        let room = null;
        let isMuted = false;
        let isSpeakerOn = true;
        let isChatOpen = false;
        let currentGroupName = "Voice Space";
        let myIsAdmin = false;
        let myIsOwner = false;

        const urlParams = new URLSearchParams(window.location.search);
        let rawId = tg?.initDataUnsafe?.start_param || urlParams.get('tgWebAppStartParam') || urlParams.get('chat_id') || "";
        let finalChatId = rawId ? (rawId.startsWith("-") ? rawId : (rawId.startsWith("100") ? `-${rawId}` : `-100${rawId}`)) : "";

        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.innerText = `✨ ${msg}`;
            el.classList.remove('hidden');
            document.getElementById('connection-state').innerText = "Notice";
            document.getElementById('status-dot').className = "absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-pink-500 border-2 border-[#0f172a]";
        }

        function getLiveKit() {
            return window.LivekitClient || window.livekit || window.LiveKit;
        }

        async function startVoiceSession() {
            if (!finalChatId) {
                return showError("Chat ID missing. Please join via group /vc button.");
            }

            const LK = getLiveKit();
            if (!LK) return showError("Audio engine loading, please retry.");

            try {
                document.getElementById('connection-state').innerText = "Authenticating profile...";
                
                const res = await fetch('/api/get-token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: finalChatId,
                        init_data: tg?.initData || ""
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Authentication Failed");
                }

                const data = await res.json();
                currentGroupName = data.group_title || "Voice Space";
                myIsAdmin = data.is_admin;
                myIsOwner = data.is_owner;

                // Group name on Main Screen & Chat Drawer
                document.getElementById('group-title').innerText = `${currentGroupName} ✨`;
                document.getElementById('chat-group-name').innerText = currentGroupName;
                document.getElementById('connection-state').innerText = "Connecting room...";

                room = new LK.Room({
                    adaptiveStream: true,
                    dynacast: true,
                    audioCaptureDefaults: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                room.on(LK.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === LK.Track.Kind.Audio) {
                        const audio = track.attach();
                        audio.playsinline = true;
                        audio.autoplay = true;
                        document.body.appendChild(audio);
                    }
                });

                room.on(LK.RoomEvent.ParticipantConnected, renderUsers);
                room.on(LK.RoomEvent.ParticipantDisconnected, renderUsers);
                room.on(LK.RoomEvent.ActiveSpeakersChanged, handleSpeakers);
                room.on(LK.RoomEvent.TrackMuted, renderUsers);
                room.on(LK.RoomEvent.TrackUnmuted, renderUsers);
                
                room.on(LK.RoomEvent.DataReceived, (payload) => {
                    try {
                        const msgObj = JSON.parse(new TextDecoder().decode(payload));
                        appendChatMessage(msgObj.name, msgObj.text, false);
                    } catch(e) {}
                });

                await room.connect(data.livekit_url, data.token);
                await room.localParticipant.setMicrophoneEnabled(true);
                isMuted = false;
                updateMicButtonUI();

                document.getElementById('connection-state').innerText = "HD Live Connected 🌸";
                const dot = document.getElementById('status-dot');
                dot.className = "absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 border-2 border-[#0f172a] animate-pulse";

                renderUsers();
            } catch (err) {
                console.error(err);
                showError(err.message);
            }
        }

        function renderUsers() {
            if (!room) return;
            const grid = document.getElementById('grid');
            grid.innerHTML = "";

            const participants = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
            document.getElementById('participant-count').innerText = participants.length;

            participants.forEach(p => {
                let meta = {};
                try { meta = JSON.parse(p.metadata || "{}"); } catch(e) {}

                // Determine if participant is muted
                let userIsMuted = true;
                p.audioTrackPublications.forEach(pub => {
                    if (pub.track && !pub.isMuted) userIsMuted = false;
                });
                if (p === room.localParticipant) {
                    userIsMuted = isMuted;
                }

                const card = document.createElement('div');
                card.className = "flex flex-col items-center gap-1.5 transition-all duration-300 cursor-pointer";
                card.onclick = () => openProfileModal(p, meta);

                const bubble = document.createElement('div');
                bubble.id = `user-${p.identity}`;
                bubble.className = `relative w-16 h-16 rounded-full border-2 ${meta.is_owner ? 'border-amber-400 shadow-md shadow-amber-400/20' : 'border-white/10'} flex items-center justify-center bg-gradient-to-tr from-slate-800 to-indigo-950 overflow-hidden shadow-lg transition-all duration-300`;

                if (meta.photo_url) {
                    bubble.innerHTML = `<img src="${meta.photo_url}" class="w-full h-full object-cover">`;
                } else {
                    const initials = (p.name || "U").slice(0, 1).toUpperCase();
                    bubble.innerHTML = `<span class="font-bold text-base bg-gradient-to-tr from-pink-400 to-indigo-300 bg-clip-text text-transparent">${initials}</span>`;
                }

                // Crown for owner
                if (meta.is_owner) {
                    const badge = document.createElement('span');
                    badge.className = "absolute top-0 right-0 text-[10px] bg-amber-400 text-slate-900 rounded-full px-1 shadow-sm";
                    badge.innerText = "👑";
                    bubble.appendChild(badge);
                }

                // Mute status mini-pill on avatar
                const muteBadge = document.createElement('span');
                muteBadge.className = `absolute bottom-0 right-0 p-1 rounded-full text-[9px] ${userIsMuted ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-slate-900'} shadow-sm`;
                muteBadge.innerHTML = userIsMuted ? `<i data-lucide="mic-off" class="w-2.5 h-2.5"></i>` : `<i data-lucide="mic" class="w-2.5 h-2.5"></i>`;
                bubble.appendChild(muteBadge);

                const label = document.createElement('span');
                label.className = "text-[11px] text-slate-300 font-semibold truncate max-w-[75px] tracking-tight text-center";
                label.innerText = p.name || `User ${p.identity}`;

                card.appendChild(bubble);
                card.appendChild(label);
                grid.appendChild(card);
            });
            if (window.lucide) lucide.createIcons();
        }

        function handleSpeakers(speakers) {
            document.querySelectorAll('[id^="user-"]').forEach(el => el.classList.remove('speaking'));
            speakers.forEach(s => {
                const target = document.getElementById(`user-${s.identity}`);
                if (target) target.classList.add('speaking');
            });
        }

        // Mute / Unmute Toggle Logic
        async function toggleMic() {
            if (!room) return;
            isMuted = !isMuted;
            await room.localParticipant.setMicrophoneEnabled(!isMuted);
            updateMicButtonUI();
            renderUsers();
        }

        function updateMicButtonUI() {
            const btn = document.getElementById('mic-btn');
            if (isMuted) {
                // Muted state: Rose/Red with mic-off
                btn.className = "w-16 h-16 rounded-full bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center shadow-lg shadow-rose-600/40 transition active:scale-95 border-2 border-white/20";
                document.getElementById('mic-icon').setAttribute("data-lucide", "mic-off");
            } else {
                // Unmuted state: Cute Gradient with mic
                btn.className = "w-16 h-16 rounded-full bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 text-white flex items-center justify-center shadow-lg shadow-purple-500/40 transition active:scale-95 border-2 border-white/20";
                document.getElementById('mic-icon').setAttribute("data-lucide", "mic");
            }
            if (window.lucide) lucide.createIcons();
        }

        function toggleSpeaker() {
            if (!room) return;
            isSpeakerOn = !isSpeakerOn;
            room.remoteParticipants.forEach(p => {
                p.audioTrackPublications.forEach(pub => {
                    if (pub.track) pub.track.setVolume(isSpeakerOn ? 1 : 0);
                });
            });
            const btn = document.getElementById('spk-btn');
            btn.className = isSpeakerOn 
                ? "w-11 h-11 rounded-full bg-slate-700/40 border border-white/10 text-slate-200 flex items-center justify-center active:scale-90 transition" 
                : "w-11 h-11 rounded-full bg-slate-800 border border-white/5 text-slate-500

version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:6.0
    restart: always
    container_name: voicespace_mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - voicespace_net

  # 2. LiveKit SFU Media Server (UDP + WebRTC Engine)
  livekit:
    image: livekit/livekit-server:latest
    restart: always
    container_name: voicespace_livekit
    command: --dev
    network_mode: "host"

  # 3. Bot + FastAPI Web Server
  voice-app:
    build: .
    restart: always
    container_name: voicespace_app
    depends_on:
      - mongo
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - voicespace_net

volumes:
  mongo_data:

networks:
  voicespace_net:
    driver: bridge
    
